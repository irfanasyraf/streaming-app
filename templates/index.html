<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>OpenShift Live Streaming Dashboard</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    h1 { color: #60a5fa; }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 25px;
    }
    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      min-width: 170px;
      flex: 1;
    }
    .value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 15px;
    }
    #status { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>OpenShift Live Streaming Dashboard</h1>
  <p>Real-time simulated telemetry using SSE</p>
  <p id="status">Connecting...</p>

  <div class="cards">
    <div class="card">
      Temperature
      <div class="value" id="temp">--</div>
    </div>
    <div class="card">
      CPU Usage
      <div class="value" id="cpu">--</div>
    </div>
    <div class="card">
      Memory Usage
      <div class="value" id="memory">--</div>
    </div>
  </div>

  <p id="updated"></p>

  <script>
    const source = new EventSource("/stream");

    source.onopen = () => {
      document.getElementById("status").textContent =
        "● Connected — Streaming live";
    };

    source.onmessage = (event) => {
      const data = JSON.parse(event.data);

      document.getElementById("temp").textContent =
        data.temperature + " °C";
      document.getElementById("cpu").textContent =
        data.cpu + " %";
      document.getElementById("memory").textContent =
        data.memory + " %";
      document.getElementById("updated").textContent =
        "Last updated: " + data.timestamp;
    };

    source.onerror = () => {
      document.getElementById("status").textContent =
        "Reconnecting to stream...";
    };
  </script>
</body>
</html>
